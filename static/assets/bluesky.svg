<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fceff"></stop>
      <stop offset="60%" stop-color="#cfeaff"></stop>
      <stop offset="100%" stop-color="#eaf6ff"></stop>
    </linearGradient>

    <radialGradient id="cloud1">
      <stop offset="0%" stop-color="#f8fbff" stop-opacity="0.7"></stop>
      <stop offset="55%" stop-color="#f8fbff" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="#f8fbff" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="cloud2">
      <stop offset="0%" stop-color="#f2f7ff" stop-opacity="0.6"></stop>
      <stop offset="60%" stop-color="#f2f7ff" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#f2f7ff" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="45"></feGaussianBlur>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.06 0"></feFuncA>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sky)"></rect>

  <g filter="url(#blur)">
    <ellipse cx="320" cy="240" rx="260" ry="150" fill="url(#cloud1)"></ellipse>
    <ellipse cx="700" cy="200" rx="220" ry="130" fill="url(#cloud2)"></ellipse>
    <ellipse cx="1020" cy="360" rx="300" ry="180" fill="url(#cloud1)"></ellipse>
    <ellipse cx="1280" cy="260" rx="180" ry="110" fill="url(#cloud2)"></ellipse>
  </g>

  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.1"></rect>
</svg>
