<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc6ff"></stop>
      <stop offset="60%" stop-color="#cfeaff"></stop>
      <stop offset="100%" stop-color="#eaf6ff"></stop>
    </linearGradient>

    <!-- Clouds -->
    <radialGradient id="cloudMain">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"></stop>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="cloudSoft">
      <stop offset="0%" stop-color="#f5f9ff" stop-opacity="0.5"></stop>
      <stop offset="70%" stop-color="#f5f9ff" stop-opacity="0.2"></stop>
      <stop offset="100%" stop-color="#f5f9ff" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="55"></feGaussianBlur>
    </filter>

    <!-- Grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.05 0"></feFuncA>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="100%" height="100%" fill="url(#sky)"></rect>

  <!-- Clouds (FEWER, BIGGER, COMPOSED) -->
  <g filter="url(#blur)">
    <!-- Main cloud mass (left/top) -->
    <ellipse cx="450" cy="220" rx="420" ry="220" fill="url(#cloudMain)"></ellipse>

    <!-- Secondary overlap -->
    <ellipse cx="850" cy="260" rx="350" ry="200" fill="url(#cloudMain)"></ellipse>

    <!-- Soft extension -->
    <ellipse cx="1150" cy="220" rx="250" ry="150" fill="url(#cloudSoft)"></ellipse>

    <!-- Small accent cloud -->
    <ellipse cx="700" cy="420" rx="180" ry="100" fill="url(#cloudSoft)"></ellipse>
  </g>

  <!-- Grain -->
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.07"></rect>
</svg>
